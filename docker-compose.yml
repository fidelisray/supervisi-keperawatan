services:
    spv-nurse-app:
        build:
            context: .
            dockerfile: Dockerfile
        image: 172.17.12.17:5051/fidelisray/supervisi-keperawatan/supervisi-keperawatan-app:latest
        container_name: supervisi-keperawatan-app
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "${APP_PORT:-2693}:80"
        env_file:
            - .env.production
        environment:
            TZ: Asia/Jakarta
        volumes:
            - app_storage:/var/www/html/storage
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/app_healthy || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        depends_on:
            spv-nurse-postgres:
                condition: service_healthy
        networks:
            - supervisi-keperawatan-network

    spv-nurse-postgres:
        image: postgres:17-alpine
        container_name: supervisi-keperawatan-postgres
        restart: unless-stopped
        # SECURITY: Port 5432 TIDAK di-expose ke host di production guna mencegah bentrok
        # dengan PostgreSQL lokal dan menutup celah akses dari luar jaringan.
        # spv-nurse-app terhubung secara internal via Docker network 'supervisi-keperawatan-network'.
        # ports:
        #     - "127.0.0.1:5432:5432"
        environment:
            TZ: Asia/Jakarta
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            supervisi-keperawatan-network:
                aliases:
                    - postgres

volumes:
    postgres_data:
        driver: local
    app_storage:
        driver: local

networks:
    supervisi-keperawatan-network:
        driver: bridge

; -------------------------------------------------------------
; Supervisi Keperawatan — PHP Production Security Hardening
; -------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Celah LFI & Session Upload Progress Mitigation
session.upload_progress.enabled = 0
session.use_strict_mode = 1
session.cookie_httponly = 1

; Remote File Inclusion (RFI) Mitigation
allow_url_include = Off

; Resource & Execution Limits
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000


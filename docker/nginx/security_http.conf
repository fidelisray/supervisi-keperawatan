# -------------------------------------------------------------
# Supervisi Keperawatan — Nginx HTTP Level Security & Rate Limiting
# Dimuat di dalam konteks http {} via /etc/nginx/conf.d/
# -------------------------------------------------------------

# Tandai apakah koneksi TCP berasal dari jaringan proxy internal / Docker bridge
geo $remote_addr $is_proxy_peer {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

# Ambil IPv4 paling kanan (yang ditambahkan oleh OpenResty) dari X-Forwarded-For
map $http_x_forwarded_for $forwarded_client_ip {
    "~([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})$" $1;
    default "";
}

# Gunakan IP klien dari X-Forwarded-For hanya jika peer adalah proxy dan format IP valid
map "$is_proxy_peer:$forwarded_client_ip" $rate_limit_key {
    "~^1:(.+)$" $1;
    default     $remote_addr;
}

limit_req_zone $rate_limit_key zone=general_limit:10m rate=15r/s;
limit_req_status 429;

# -------------------------------------------------------------
# Supervisi Keperawatan — Nginx HTTP Level Security & Rate Limiting
# Dimuat di dalam konteks http {} via /etc/nginx/conf.d/
# -------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
limit_req_status 429;

# Ekstrak IP klien asli dari upstream reverse proxy (Docker bridge & LAN RS)
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

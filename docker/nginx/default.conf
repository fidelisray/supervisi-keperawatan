server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Sembunyikan versi Nginx di header respon server
    server_tokens off;

    # HTTP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    index index.php index.html;
    charset utf-8;

    # Batas ukuran payload request unggahan
    client_max_body_size 64M;

    # Buffer mitigasi serangan buffer overflow
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Proteksi khusus brute-force pada endpoint login
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Proteksi umum DoS & rate limiting untuk seluruh rute aplikasi
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite compiled static assets (caching agresif, bypass rate limiting)
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # Blokir akses ke berkas sensitif, ekstensi backup, konfigurasi, dan dump
    location ~* \.(sql|bak|log|env|git|sh|yaml|yml|md|xml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    # Forward request PHP ke PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Blokir seluruh akses ke dotfiles (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
